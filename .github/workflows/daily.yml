name: Daily 2K27 MyTEAM Price Check

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = 香港時間每天早上 10:00
  workflow_dispatch:      # 允許隨時手動點擊「立即更新」

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run 2K27 scraper
        run: python scraper.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update 2K27 MyTEAM lowest prices" || exit 0
          git pull --rebase origin main
          git push
