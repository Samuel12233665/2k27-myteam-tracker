<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBA 2K27 MyTEAM 每日各等級最低價監察</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 920px; margin: 0 auto; background: #1e293b; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); padding: 24px; border: 1px solid #334155; }
    h1 { font-size: 1.45rem; margin: 0 0 8px; color: #f8fafc; }
    .meta { font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .badge { background: #3b82f6; color: #fff; padding: 3px 10px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; font-weight: 600; color: #cbd5e1; }
    .ovr-pill { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 1rem; }
    .ovr-93 { background: #0284c7; color: #fff; }
    .ovr-94 { background: #7c3aed; color: #fff; }
    .ovr-95 { background: #db2777; color: #fff; }
    .ovr-96 { background: #d97706; color: #fff; }
    .price { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }
    .up { color: #f87171; font-weight: 600; }
    .down { color: #34d399; font-weight: 600; }
    .flat { color: #94a3b8; }
    a.btn { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.85rem; }
    a.btn:hover { background: #1d4ed8; }
    @media (max-width: 640px) { th, td { padding: 10px 6px; font-size: 0.85rem; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏀 NBA 2K27 MyTEAM 每日各等級最低價監察</h1>
    <div class="meta">
      <span>最後更新：<strong id="updated-at">載入中...</strong> (香港時間)</span>
      <span class="badge">數據來源：2kauction.com</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>卡片評分 (OVR)</th>
          <th>當日最低價 (MT)</th>
          <th>前三低價參考</th>
          <th>較昨日升跌</th>
          <th>狀態</th>
          <th>直達拍賣場</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6">正在讀取最新拍賣行數據...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    fetch('data.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        document.getElementById('updated-at').textContent = data.updated_at;
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        data.items.forEach(item => {
          const priceStr = item.min_price ? `${item.min_price.toLocaleString()} MT` : '暫無數據';
          const top3Str = (item.top3_prices && item.top3_prices.length)
            ? item.top3_prices.map(p => p.toLocaleString()).join(' / ') + ' MT'
            : '-';

          let diffStr = '無變動';
          let diffClass = 'flat';
          if (item.daily_diff > 0) { diffStr = `▲ +${item.daily_diff.toLocaleString()} MT`; diffClass = 'up'; }
          else if (item.daily_diff < 0) { diffStr = `▼ -${Math.abs(item.daily_diff).toLocaleString()} MT`; diffClass = 'down'; }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="ovr-pill ovr-${item.ovr}">${item.ovr} OVR</span></td>
            <td class="price">${priceStr}</td>
            <td style="color:#cbd5e1; font-size:0.85rem;">${top3Str}</td>
            <td class="${diffClass}">${diffStr}</td>
            <td style="color:#94a3b8; font-size:0.85rem;">${item.status}</td>
            <td><a class="btn" href="${item.url}" target="_blank">前往查看</a></td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="6">尚未產生數據，請先在 GitHub Actions 執行一次工作流。</td></tr>';
      });
  </script>
</body>
</html>
